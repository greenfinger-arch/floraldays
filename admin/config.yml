backend:
  name: github
  repo: greenfinger-arch/floraldays  # ← 새로 만드실 GitHub 레포지토리 주소로 변경하세요!
  branch: main
  base_url: https://black-sun-634d.garcia47stand.workers.dev
  auth_endpoint: /auth

site_url: https://floraldays.com/
display_url: https://floraldays.com/

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "블로그 포스트"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "제목"
        name: "title"
        widget: "string"

      - label: "영문 URL 슬러그"
        name: "slug"
        widget: "string"
        required: true
        hint: "예: plant-pruning-guide (소문자, 하이픈만 사용)"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "나무의사·국가자격증 스터디"
          - "수목진료 및 병해충 실무 SOP"
          - "식물 트렌드 & 스마트 가드닝"
          - "홈가드닝 & 반려식물 클리닉"
          - "도시숲, 생태 및 나무 인문학"

      - label: "📌 카테고리 기둥 기사(Pillar Content)로 고정"
        name: "is_pillar"
        widget: "boolean"
        default: false
        required: false

      - label: "발행일"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"

      - label: "대표 이미지"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "요약문"
        name: "excerpt"
        widget: "text"

      - label: "본문 내용"
        name: "body"
        widget: "markdown"

              - label: "본문 내용"
        name: "body"
        widget: "markdown"

# ▼ 아래 내용을 config.yml 맨 아래에 추가하세요 ▼
editor_components:
  - id: "custom-image"
    label: "본문 이미지 (크기/캡션 자동 맞춤)"
    fields:
      - name: "image"
        label: "이미지 선택"
        widget: "image"
      - name: "alt"
        label: "대체 텍스트 (Alt)"
        widget: "string"
      - name: "caption"
        label: "이미지 설명 (캡션)"
        widget: "string"
        required: false
      - name: "width"
        label: "가로 크기 (px)"
        widget: "string"
        default: "650"
    pattern: '^<figure style="text-align: center; margin: 1.5rem 0;"><img src="(.*?)" alt="(.*?)" style="max-width: (.*?)px; width: 100%; height: auto; border-radius: 8px;"><figcaption style="font-size: 0.9em; color: #666; margin-top: 0.5rem;">(.*?)</figcaption></figure>$'
    fromBlock: |
      function(match) {
        return {
          image: match[1],
          alt: match[2],
          width: match[3],
          caption: match[4]
        };
      }
    toBlock: |
      function(obj) {
        return '<figure style="text-align: center; margin: 1.5rem 0;"><img src="' + obj.image + '" alt="' + obj.alt + '" style="max-width: ' + obj.width + 'px; width: 100%; height: auto; border-radius: 8px;"><figcaption style="font-size: 0.9em; color: #666; margin-top: 0.5rem;">' + obj.caption + '</figcaption></figure>';
      }
    toPreview: |
      function(obj) {
        return '<figure style="text-align: center;"><img src="' + obj.image + '" alt="' + obj.alt + '" style="max-width: ' + obj.width + 'px; width: 100%;"><figcaption>' + obj.caption + '</figcaption></figure>';
      }
