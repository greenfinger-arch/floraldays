backend:
  name: github
  repo: greenfinger-arch/floraldays  # ← 새로 만드실 GitHub 레포지토리 주소로 변경하세요!
  branch: main
  base_url: https://black-sun-634d.garcia47stand.workers.dev
  auth_endpoint: /auth

site_url: https://floraldays.com/
display_url: https://floraldays.com/

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "블로그 포스트"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "제목"
        name: "title"
        widget: "string"

      - label: "영문 URL 슬러그"
        name: "slug"
        widget: "string"
        required: true
        hint: "예: plant-pruning-guide (소문자, 하이픈만 사용)"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "나무의사·국가자격증 스터디"
          - "수목진료 및 병해충 실무 SOP"
          - "식물 트렌드 & 스마트 가드닝"
          - "홈가드닝 & 반려식물 클리닉"
          - "도시숲, 생태 및 나무 인문학"

      - label: "📌 카테고리 기둥 기사(Pillar Content)로 고정"
        name: "is_pillar"
        widget: "boolean"
        default: false
        required: false

      - label: "발행일"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"

      - label: "대표 이미지"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "요약문"
        name: "excerpt"
        widget: "text"

      - label: "본문 내용"
        name: "body"
        widget: "markdown"